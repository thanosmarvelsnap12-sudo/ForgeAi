<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>GameKit Quest Tracker</title><style>body{font-family:system-ui;background:#080b12;color:#fff;padding:20px;max-width:720px;margin:auto}h1{font-size:34px}.card{background:#111621;border:1px solid #293144;border-radius:16px;padding:16px;margin:10px 0}label{display:flex;gap:12px;align-items:center}.bar{height:10px;background:#293144;border-radius:9px;overflow:hidden}.fill{height:100%;width:0;background:#8e9aff;transition:.2s}button{margin-top:15px;padding:12px 16px;border:0;border-radius:10px;font-weight:800}</style></head><body><h1>🎮 GameKit Quest Tracker</h1><p>Check off your quests and watch your progress.</p><div id="quests"></div><div class="card"><b>Progress</b><p id="count">0 / 8 completed</p><div class="bar"><div class="fill" id="fill"></div></div><button onclick="resetAll()">Reset quests</button></div><script>const names=['Play for 30 minutes','Complete one daily challenge','Try a new game','Organize your game library','Record one gameplay clip','Plan one video idea','Clean up your setup','Take a gaming break'];const root=document.querySelector('#quests');names.forEach((n,i)=>{const d=document.createElement('div');d.className='card';d.innerHTML=`<label><input type="checkbox" data-i="${i}"> ${n}</label>`;root.appendChild(d)});const boxes=[...document.querySelectorAll('input')];boxes.forEach((b,i)=>{b.checked=localStorage.getItem('gq'+i)==='1';b.onchange=()=>{localStorage.setItem('gq'+i,b.checked?'1':'0');update()}});function update(){let n=boxes.filter(x=>x.checked).length;document.querySelector('#count').textContent=`${n} / ${boxes.length} completed`;document.querySelector('#fill').style.width=(n/boxes.length*100)+'%'}function resetAll(){boxes.forEach((b,i)=>{b.checked=false;localStorage.removeItem('gq'+i)});update()}update();</script></body></html>
