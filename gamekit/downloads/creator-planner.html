<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>GameKit Creator Planner</title><style>body{font-family:system-ui;background:#080b12;color:#fff;padding:20px;max-width:760px;margin:auto}textarea{width:100%;min-height:110px;background:#111621;color:#fff;border:1px solid #293144;border-radius:12px;padding:12px;box-sizing:border-box}button{margin-top:10px;padding:12px 16px;border:0;border-radius:10px;font-weight:800}.card{background:#111621;border:1px solid #293144;border-radius:16px;padding:18px;margin:14px 0}</style></head><body><h1>📺 GameKit Creator Planner</h1><div class="card"><h3>Video idea</h3><textarea id="idea" placeholder="What are you making?"></textarea></div><div class="card"><h3>Hook</h3><textarea id="hook" placeholder="Why should someone watch?"></textarea></div><div class="card"><h3>Checklist</h3><label><input type="checkbox"> Thumbnail</label><br><label><input type="checkbox"> Title</label><br><label><input type="checkbox"> Description</label><br><label><input type="checkbox"> Record</label><br><label><input type="checkbox"> Edit</label><br><label><input type="checkbox"> Publish</label></div><button onclick="save()">Save notes on this device</button><script>function save(){localStorage.setItem('idea',document.querySelector('#idea').value);localStorage.setItem('hook',document.querySelector('#hook').value);alert('Saved on this device.')}document.querySelector('#idea').value=localStorage.getItem('idea')||'';document.querySelector('#hook').value=localStorage.getItem('hook')||'';</script></body></html>
